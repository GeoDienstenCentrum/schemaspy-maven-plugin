name: 'OWASP dependency check'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ ( github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('ci-master-{0}', github.sha) || format('ci-master-{0}', github.ref) }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * MON-FRI'

jobs:
  build:
    name: "Java 17"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 'Set up JDK'
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: 'Restore OWASP cache'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}
          restore-keys: |
            owasp-db-maven

      - name: 'Update OWASP Dependency Check Database'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -U org.owasp:dependency-check-maven:update-only -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: 'Save OWASP cache'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}

      - name: 'OWASP Dependency Check'
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn package -Dmaven.test.skip=true org.owasp:dependency-check-maven:check -fae -B -Dorg.slf4j.simpleLogger.defaultLogLevel=WARN -DfailBuildOnCVSS=7

      - name: 'Upload result to GitHub Code Scanning'
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: target/dependency-check-report.sarif
